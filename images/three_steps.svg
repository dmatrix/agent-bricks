<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-label="Agent Bricks CLI lifecycle: agentbricks init, agentbricks dev, agentbricks deploy">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="448" fill="white"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="15" font-weight="700" fill="#111827">Agent Bricks CLI Lifecycle</text>

  <!-- ═══════════════════ BOX 1 — agentbricks init ═══════════════════ -->
  <rect x="30" y="44" width="250" height="308" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="30" y="44" width="250" height="46" fill="#ff5f46"/>
  <text x="155" y="73" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"
        font-size="13" font-weight="700" fill="white">agentbricks init</text>

  <!-- Bullets -->
  <text x="48" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Scaffold from framework template</text>
  <text x="48" y="137" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Write agent.toml with resource</text>
  <text x="63" y="153" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">declarations</text>
  <text x="48" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Declare memory + session stores</text>
  <text x="48" y="199" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Bind tools (sandbox, MCP,</text>
  <text x="63" y="215" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">UC functions)</text>
  <text x="48" y="238" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Seed .env with profile for</text>
  <text x="63" y="254" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">immediate local dev</text>
  <text x="48" y="277" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Enable MLflow tracing by default</text>

  <!-- ══ Arrow 1 → 2 ══ -->
  <line x1="281" y1="198" x2="317" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════ BOX 2 — agentbricks dev ═══════════════════ -->
  <rect x="325" y="44" width="250" height="308" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="325" y="44" width="250" height="46" fill="#ff5f46"/>
  <text x="450" y="73" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"
        font-size="13" font-weight="700" fill="white">agentbricks dev</text>

  <!-- Bullets -->
  <text x="343" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Runs from same app.yaml as</text>
  <text x="358" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">production</text>
  <text x="343" y="153" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Validates bound stores and</text>
  <text x="358" y="169" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">tools from agent.toml</text>
  <text x="343" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Auto-connects to Databricks</text>
  <text x="358" y="208" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">model serving</text>
  <text x="343" y="231" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Sends traces to per-project</text>
  <text x="358" y="247" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">MLflow experiment</text>

  <!-- ══ Arrow 2 → 3 ══ -->
  <line x1="576" y1="198" x2="612" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════ BOX 3 — agentbricks deploy ═══════════════════ -->
  <rect x="620" y="44" width="250" height="308" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="620" y="44" width="250" height="46" fill="#ff5f46"/>
  <text x="745" y="73" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"
        font-size="13" font-weight="700" fill="white">agentbricks deploy</text>

  <!-- Bullets -->
  <text x="638" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Provision memory and</text>
  <text x="653" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">session stores if missing</text>
  <text x="638" y="153" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Grant service principal</text>
  <text x="653" y="169" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">access to all stores</text>
  <text x="638" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Deploy agent to the</text>
  <text x="653" y="208" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">Databricks agent runtime</text>
  <text x="638" y="231" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#374151">▸  Return deployed agent URL</text>

  <!-- ═══════════════════ agent.toml connector ═══════════════════ -->
  <!-- Vertical dashed lines from box bottoms -->
  <line x1="155" y1="352" x2="155" y2="383" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="450" y1="352" x2="450" y2="383" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="745" y1="352" x2="745" y2="383" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Horizontal connecting bar -->
  <line x1="155" y1="383" x2="745" y2="383" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Blue arrow down to agent.toml box -->
  <line x1="450" y1="383" x2="450" y2="399" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- agent.toml box -->
  <rect x="330" y="400" width="240" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="417" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"
        font-size="12" font-weight="700" fill="#1d4ed8">agent.toml</text>
  <!-- Caption -->
  <text x="450" y="440" text-anchor="middle"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="10" fill="#6b7280">Declarative source of truth: managed resources, tools, stores, and tracing config</text>
</svg>
