<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Components of an agent: requests from users, apps, and agents reach the agent runtime, which runs the agent server, which keeps durable run state and wraps the agent loop built with a framework or harness. The loop reasons with a model, calls tools, and reads and writes agent state, with observability and governance around it.">
  <defs>
    <pattern id="an-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#efebe6" stroke-width="1"/>
    </pattern>
    <filter id="an-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2b3540" flood-opacity="0.08"/>
    </filter>
    <style>
      .t { font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #1f2a33; }
      .sub { font-size: 13px; fill: #8b939b; }
      .chip { font-size: 12.5px; fill: #1f2a33; }
      .small { font-size: 10px; fill: #36424d; }
      .label { font-size: 12px; font-weight: 700; fill: #36424d; letter-spacing: 1.8px; }
      .label2 { font-size: 10.5px; font-weight: 700; fill: #5b6772; letter-spacing: 1.6px; }
      .caps { font-size: 10.5px; font-weight: 700; fill: #e8553f; letter-spacing: 2px; }
      .card { fill: #ffffff; stroke: #ebe6e0; stroke-width: 1; }
      .tile { fill: #f6f3ef; stroke: #ebe6e0; stroke-width: 1; }
      .pill { fill: #ffffff; stroke: #e6e1db; stroke-width: 1; }
      .wire { stroke: #8a96a0; stroke-width: 1.5; fill: none; }
      .node { fill: #e8553f; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="470" rx="16" fill="#f8f6f3"/>
  <rect width="1000" height="470" rx="16" fill="url(#an-grid)"/>

  <!-- Request -->
  <rect x="425" y="24" width="190" height="30" rx="9" fill="#ffffff" stroke="#e8553f" stroke-width="1.5"/>
  <circle cx="443" cy="39" r="4" class="node"/>
  <text x="455" y="43.5" class="t chip">Users, apps, and agents</text>
  <line x1="520" y1="54" x2="520" y2="86" class="wire"/>
  <circle cx="520" cy="70" r="3.5" class="node"/>

  <!-- Model -->
  <rect x="54" y="110" width="232" height="72" rx="14" class="card" filter="url(#an-shadow)"/>
  <rect x="66" y="122" width="48" height="48" rx="10" class="tile"/>
  <path d="M 90 131 L 93.5 142.5 L 105 146 L 93.5 149.5 L 90 161 L 86.5 149.5 L 75 146 L 86.5 142.5 Z" fill="#e8553f"/>
  <circle cx="103" cy="132" r="2.5" fill="#f2a093"/>
  <text x="126" y="143" class="t title">Model</text>
  <text x="126" y="165" class="t sub">Reasons and decides</text>
  <line x1="286" y1="146" x2="318" y2="146" class="wire"/>
  <circle cx="302" cy="146" r="3.5" class="node"/>

  <!-- Governance -->
  <rect x="54" y="250" width="232" height="72" rx="14" class="card" filter="url(#an-shadow)"/>
  <rect x="66" y="262" width="48" height="48" rx="10" class="tile"/>
  <path d="M 90 271 L 104 276 L 104 287 C 104 296 98 302 90 305 C 82 302 76 296 76 287 L 76 276 Z" fill="#2f3e4b"/>
  <path d="M 84 288 L 88.5 292.5 L 96.5 284" fill="none" stroke="#e8553f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="283" class="t title">Governance</text>
  <text x="126" y="305" class="t sub">Permissions · policies</text>
  <line x1="286" y1="286" x2="318" y2="286" class="wire"/>
  <circle cx="302" cy="286" r="3.5" class="node"/>

  <!-- Agent runtime -->
  <rect x="318" y="86" width="404" height="266" rx="16" fill="#f0eeeb" stroke="#36424d" stroke-width="2"/>
  <text x="338" y="117" class="t label">AGENT RUNTIME</text>
  <rect x="482" y="102" width="70" height="24" rx="12" class="pill"/>
  <circle cx="494" cy="114" r="3" fill="#2f3e4b"/>
  <text x="502" y="117.5" class="t small">Hosting</text>
  <rect x="558" y="102" width="70" height="24" rx="12" class="pill"/>
  <circle cx="570" cy="114" r="3" fill="#2f3e4b"/>
  <text x="578" y="117.5" class="t small">Identity</text>
  <rect x="634" y="102" width="70" height="24" rx="12" class="pill"/>
  <circle cx="646" cy="114" r="3" fill="#2f3e4b"/>
  <text x="654" y="117.5" class="t small">Scaling</text>

  <!-- Agent server -->
  <rect x="338" y="136" width="364" height="200" rx="12" fill="#f8f7f5" stroke="#9aa4ad" stroke-width="1.2"/>
  <text x="354" y="160" class="t label2">AGENT SERVER</text>
  <rect x="474" y="146" width="100" height="22" rx="11" class="pill"/>
  <circle cx="486" cy="157" r="3" fill="#2f3e4b"/>
  <text x="494" y="160.5" class="t small">Invocation API</text>
  <rect x="580" y="146" width="114" height="22" rx="11" class="pill"/>
  <circle cx="592" cy="157" r="3" class="node"/>
  <text x="600" y="160.5" class="t small">Durable run state</text>

  <!-- Agent loop (stacked) -->
  <rect x="412" y="176" width="240" height="72" rx="14" fill="#f3f1ee" stroke="#e6e1db" stroke-width="1"/>
  <rect x="400" y="184" width="240" height="72" rx="14" class="card" filter="url(#an-shadow)"/>
  <rect x="412" y="196" width="48" height="48" rx="10" class="tile"/>
  <text x="436" y="225" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#e8553f">&lt;/&gt;</text>
  <rect x="429" y="231" width="14" height="2.5" rx="1.2" fill="#e8553f"/>
  <text x="472" y="217" class="t title">Agent loop</text>
  <text x="472" y="239" class="t sub">Framework or harness</text>

  <!-- Loop steps -->
  <rect x="393" y="280" width="84" height="28" rx="9" class="pill"/>
  <circle cx="409" cy="294" r="4" class="node"/>
  <text x="420" y="298.5" class="t chip">Reason</text>
  <rect x="485" y="280" width="64" height="28" rx="9" class="pill"/>
  <circle cx="501" cy="294" r="4" class="node"/>
  <text x="512" y="298.5" class="t chip">Act</text>
  <rect x="557" y="280" width="90" height="28" rx="9" class="pill"/>
  <circle cx="573" cy="294" r="4" class="node"/>
  <text x="584" y="298.5" class="t chip">Observe</text>

  <!-- Tools -->
  <text x="776" y="72" class="t title">Tools</text>
  <line x1="722" y1="166" x2="750" y2="166" class="wire"/>
  <line x1="750" y1="98" x2="750" y2="234" class="wire"/>
  <circle cx="736" cy="166" r="3.5" class="node"/>
  <line x1="750" y1="98" x2="776" y2="98" class="wire"/>
  <rect x="776" y="84" width="150" height="28" rx="9" class="pill"/>
  <circle cx="792" cy="98" r="4" class="node"/>
  <text x="806" y="102.5" class="t chip">MCP servers</text>
  <line x1="750" y1="132" x2="776" y2="132" class="wire"/>
  <rect x="776" y="118" width="150" height="28" rx="9" class="pill"/>
  <circle cx="792" cy="132" r="4" fill="#2f3e4b"/>
  <text x="806" y="136.5" class="t chip">APIs</text>
  <line x1="750" y1="166" x2="776" y2="166" class="wire"/>
  <rect x="776" y="152" width="150" height="28" rx="9" class="pill"/>
  <circle cx="792" cy="166" r="4" fill="#2f3e4b"/>
  <text x="806" y="170.5" class="t chip">Search and SQL</text>
  <line x1="750" y1="200" x2="776" y2="200" class="wire"/>
  <rect x="776" y="186" width="150" height="28" rx="9" class="pill"/>
  <circle cx="792" cy="200" r="4" fill="#2f3e4b"/>
  <text x="806" y="204.5" class="t chip">Sandboxes</text>
  <line x1="750" y1="234" x2="776" y2="234" class="wire"/>
  <rect x="776" y="220" width="150" height="28" rx="9" class="pill"/>
  <circle cx="792" cy="234" r="4" fill="#b8bfc6"/>
  <text x="806" y="238.5" class="t chip">Other agents</text>

  <!-- Agent state -->
  <line x1="722" y1="320" x2="730" y2="320" class="wire"/>
  <circle cx="726" cy="320" r="3.5" class="node"/>
  <rect x="730" y="284" width="260" height="72" rx="14" class="card" filter="url(#an-shadow)"/>
  <rect x="742" y="296" width="48" height="48" rx="10" class="tile"/>
  <rect x="754" y="306" width="24" height="28" rx="2" fill="#2f3e4b"/>
  <ellipse cx="766" cy="306" rx="12" ry="4.5" fill="#4b5966"/>
  <ellipse cx="766" cy="334" rx="12" ry="4.5" fill="#2f3e4b"/>
  <path d="M 754 315 A 12 4.5 0 0 0 778 315" fill="none" stroke="#6b7884" stroke-width="1.2"/>
  <path d="M 754 324 A 12 4.5 0 0 0 778 324" fill="none" stroke="#6b7884" stroke-width="1.2"/>
  <text x="802" y="315" class="t title">Agent state</text>
  <text x="802" y="337" class="t sub">Sessions · memory</text>

  <!-- Observability -->
  <line x1="520" y1="352" x2="520" y2="384" class="wire"/>
  <circle cx="520" cy="368" r="3.5" class="node"/>
  <rect x="370" y="384" width="300" height="72" rx="14" class="card" filter="url(#an-shadow)"/>
  <rect x="382" y="396" width="48" height="48" rx="10" class="tile"/>
  <rect x="391" y="406" width="24" height="4" rx="2" fill="#2f3e4b"/>
  <rect x="395" y="414" width="18" height="4" rx="2" fill="#e8553f"/>
  <rect x="401" y="422" width="16" height="4" rx="2" fill="#8a96a0"/>
  <path d="M 405 433 L 409 437 L 417 429" fill="none" stroke="#e8553f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="442" y="415" class="t title">Observability</text>
  <text x="442" y="437" class="t sub">Traces · evaluation</text>
</svg>
