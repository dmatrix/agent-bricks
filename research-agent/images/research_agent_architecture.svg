<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48c9b0"/>
      <stop offset="100%" style="stop-color:#1abc9c"/>
    </linearGradient>
    <linearGradient id="runtimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a5276"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73e54"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#6c3d9e"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2833"/>
      <stop offset="100%" style="stop-color:#2c3e50"/>
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#2ecc71;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="subtleShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="780" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="780" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="780" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="780" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="780" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="80" cy="120" r="35" fill="#e94560" opacity="0.06"/>
  <circle cx="1120" cy="700" r="45" fill="#48c9b0" opacity="0.06"/>
  <circle cx="150" cy="710" r="25" fill="#533483" opacity="0.05"/>
  <circle cx="1060" cy="90" r="30" fill="#0f3460" opacity="0.07"/>
  <circle cx="300" cy="68" r="3" fill="#e94560" opacity="0.15"/>
  <circle cx="900" cy="764" r="3" fill="#48c9b0" opacity="0.15"/>

  <!-- MLflow Tracing backdrop -->
  <rect x="30" y="86" width="1140" height="660" rx="18" fill="url(#traceGrad)" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.12"/>
  <text x="55" y="111" fill="#2ecc71" font-size="11" font-weight="600" opacity="0.5" letter-spacing="2">MLflow TRACING  ·  local sqlite server under .agentbricks/  ·  bound workspace experiment once deployed</text>

  <!-- Title -->
  <text x="600" y="42" fill="#fff" font-size="13" font-weight="600" text-anchor="middle" opacity="0.35" letter-spacing="3">RESEARCH-AGENT  ·  A DEEP AGENT SERVED BY AGENT BRICKS</text>

  <!-- Tech badges -->
  <g transform="translate(360, 56)">
    <rect x="0" y="0" width="110" height="22" rx="11" fill="#e94560" opacity="0.15"/>
    <text x="55" y="15" fill="#e94560" font-size="10" font-weight="600" text-anchor="middle">Deep Agents</text>
    <rect x="125" y="0" width="90" height="22" rx="11" fill="#4fc3f7" opacity="0.15"/>
    <text x="170" y="15" fill="#4fc3f7" font-size="10" font-weight="600" text-anchor="middle">LangGraph</text>
    <rect x="230" y="0" width="115" height="22" rx="11" fill="#2ecc71" opacity="0.15"/>
    <text x="287" y="15" fill="#2ecc71" font-size="10" font-weight="600" text-anchor="middle">MLflow Tracing</text>
    <rect x="360" y="0" width="120" height="22" rx="11" fill="#f5a623" opacity="0.15"/>
    <text x="420" y="15" fill="#f5a623" font-size="10" font-weight="600" text-anchor="middle">Databricks Apps</text>
  </g>

  <!-- ============ CLIENTS ============ -->
  <g filter="url(#softShadow)">
    <rect x="250" y="126" width="280" height="56" rx="28" fill="url(#clientGrad)"/>
    <rect x="670" y="126" width="280" height="56" rx="28" fill="url(#clientGrad)"/>
  </g>
  <!-- Browser icon -->
  <g transform="translate(288, 154)">
    <rect x="-12" y="-10" width="24" height="20" rx="3" fill="none" stroke="#fff" stroke-width="2.2"/>
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#fff" stroke-width="2.2"/>
  </g>
  <text x="310" y="150" fill="#fff" font-size="15" font-weight="700">Chat app</text>
  <text x="310" y="167" fill="#fff" font-size="10.5" opacity="0.8">ui/ — plan, folded tool rows, events pane</text>
  <!-- Terminal icon -->
  <g transform="translate(708, 154)">
    <rect x="-12" y="-10" width="24" height="20" rx="3" fill="none" stroke="#fff" stroke-width="2.2"/>
    <path d="M-6 -3 l4 3 l-4 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="730" y="150" fill="#fff" font-size="15" font-weight="700">HTTP client</text>
  <text x="730" y="167" fill="#fff" font-size="10.5" opacity="0.8">curl  ·  agentbricks endpoint invoke</text>

  <!-- Arrows: clients -> runtime -->
  <line x1="390" y1="182" x2="390" y2="200" stroke="#48c9b0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <polygon points="383,200 390,212 397,200" fill="#48c9b0" opacity="0.7"/>
  <line x1="810" y1="182" x2="810" y2="200" stroke="#48c9b0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <polygon points="803,200 810,212 817,200" fill="#48c9b0" opacity="0.7"/>
  <rect x="468" y="186" width="264" height="21" rx="10" fill="#48c9b0" opacity="0.12"/>
  <text x="600" y="201" fill="#48c9b0" font-size="10.5" font-weight="600" text-anchor="middle">POST /api/invocations  ·  id, session_id, input</text>

  <!-- ============ AGENT BRICKS RUNTIME ============ -->
  <g filter="url(#softShadow)">
    <rect x="150" y="212" width="900" height="84" rx="16" fill="url(#runtimeGrad)"/>
  </g>
  <g transform="translate(188, 254)">
    <rect x="-13" y="-13" width="26" height="26" rx="5" fill="none" stroke="#4fc3f7" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#4fc3f7" opacity="0.8"/>
    <line x1="0" y1="-13" x2="0" y2="-18" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="13" x2="0" y2="18" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="218" y="247" fill="#fff" font-size="17" font-weight="700">Agent Bricks runtime</text>
  <text x="218" y="266" fill="#4fc3f7" font-size="11" font-weight="500">runtime/main.py — DurableAgentServer  ·  runtime/adapter.py — invoke() / recover()</text>
  <text x="218" y="283" fill="#fff" font-size="10" opacity="0.65">translates the invocation into graph input, relays state-channel updates back out as events</text>

  <!-- Arrow: runtime -> agent -->
  <line x1="600" y1="296" x2="600" y2="308" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <polygon points="593,308 600,320 607,308" fill="#4fc3f7" opacity="0.7"/>
  <rect x="624" y="298" width="232" height="19" rx="9" fill="#4fc3f7" opacity="0.12"/>
  <text x="636" y="312" fill="#4fc3f7" font-size="10" font-weight="600">messages  |  Command(resume)</text>

  <!-- ============ DEEP AGENT ============ -->
  <g filter="url(#softShadow)">
    <rect x="150" y="322" width="900" height="130" rx="18" fill="url(#agentGrad)"/>
  </g>
  <!-- Brain icon -->
  <g transform="translate(192, 362)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#fff" stroke-width="2" opacity="0.9"/>
    <circle cx="-5" cy="-3" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="5" cy="-3" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="0" cy="5" r="3" fill="#fff" opacity="0.8"/>
    <line x1="-5" y1="-3" x2="5" y2="-3" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <line x1="-5" y1="-3" x2="0" y2="5" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <line x1="5" y1="-3" x2="0" y2="5" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  </g>
  <text x="220" y="356" fill="#fff" font-size="20" font-weight="700">Deep Agent</text>
  <text x="220" y="378" fill="#fff" font-size="11.5" opacity="0.8">agent/agent.py:run_agent  →  create_deep_agent(model, tools, system_prompt, subagents, backend, interrupt_on)</text>
  <text x="178" y="399" fill="#fff" font-size="10" opacity="0.6" letter-spacing="1">THREE MIDDLEWARES, INSTALLED UNCONDITIONALLY — NO FLAG OMITS THEM</text>
  <g filter="url(#subtleShadow)">
    <rect x="175" y="406" width="270" height="28" rx="9" fill="url(#chipGrad)" stroke="#fff" stroke-width="1" stroke-opacity="0.18"/>
    <rect x="465" y="406" width="270" height="28" rx="9" fill="url(#chipGrad)" stroke="#fff" stroke-width="1" stroke-opacity="0.18"/>
    <rect x="755" y="406" width="270" height="28" rx="9" fill="url(#chipGrad)" stroke="#fff" stroke-width="1" stroke-opacity="0.18"/>
  </g>
  <text x="192" y="424" fill="#fff" font-size="10.5" font-weight="600">planning  ·  write_todos</text>
  <text x="482" y="424" fill="#fff" font-size="10.5" font-weight="600">filesystem  ·  StateBackend</text>
  <text x="772" y="424" fill="#fff" font-size="10.5" font-weight="600">subagents  ·  task</text>

  <!-- Arrow: agent -> tools -->
  <path d="M400 452 Q358 478 334 494" stroke="#bb86fc" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <polygon points="340,487 328,498 342,500" fill="#bb86fc" opacity="0.6"/>
  <rect x="356" y="458" width="62" height="20" rx="10" fill="#bb86fc" opacity="0.15"/>
  <text x="387" y="472" fill="#bb86fc" font-size="10" font-weight="600" text-anchor="middle">tools</text>

  <!-- Arrow: agent -> model -->
  <path d="M800 452 Q848 478 894 494" stroke="#4fc3f7" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <polygon points="888,487 900,498 886,500" fill="#4fc3f7" opacity="0.6"/>
  <rect x="790" y="458" width="62" height="20" rx="10" fill="#4fc3f7" opacity="0.15"/>
  <text x="821" y="472" fill="#4fc3f7" font-size="10" font-weight="600" text-anchor="middle">model</text>

  <!-- Self-loop: the agent leaves its own bottom edge and comes back into it. Model -> tool ->
       update the plan -> model again, which is the shape a Deep Agent turn actually has. -->
  <path d="M556 452 C550 500 646 500 640 458" stroke="#f5a623" stroke-width="2" fill="none" stroke-dasharray="6,4" stroke-linecap="round" opacity="0.5"/>
  <polygon points="633,464 641,450 648,465" fill="#f5a623" opacity="0.5"/>
  <rect x="440" y="468" width="104" height="20" rx="10" fill="#f5a623" opacity="0.1"/>
  <text x="492" y="482" fill="#f5a623" font-size="10" font-weight="600" text-anchor="middle" opacity="0.8">re-plan loop</text>

  <!-- ============ LOCAL TOOLS ============ -->
  <g filter="url(#softShadow)">
    <rect x="70" y="498" width="600" height="190" rx="16" fill="url(#toolGrad)"/>
  </g>
  <g transform="translate(108, 534)">
    <circle cx="0" cy="-5" r="5" fill="none" stroke="#bb86fc" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#bb86fc" stroke-width="2"/>
  </g>
  <text x="132" y="530" fill="#fff" font-size="16" font-weight="700">Tools</text>
  <text x="132" y="548" fill="#bb86fc" font-size="10.5" font-weight="500">LOCAL  ·  agent/tools/ — auto-discovered</text>
  <g filter="url(#subtleShadow)">
    <rect x="90" y="558" width="272" height="26" rx="8" fill="url(#chipGrad)" stroke="#bb86fc" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="372" y="558" width="272" height="26" rx="8" fill="url(#chipGrad)" stroke="#bb86fc" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="90" y="588" width="272" height="26" rx="8" fill="url(#chipGrad)" stroke="#bb86fc" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="372" y="588" width="272" height="26" rx="8" fill="url(#chipGrad)" stroke="#bb86fc" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <text x="104" y="575" fill="#bb86fc" font-size="10" font-weight="600">search_knowledge_base  ·  9 topics</text>
  <text x="386" y="575" fill="#bb86fc" font-size="10" font-weight="600">get_mlflow_adoption  ·  live, sourced</text>
  <text x="104" y="605" fill="#bb86fc" font-size="10" font-weight="600">get_current_time</text>
  <text x="386" y="605" fill="#bb86fc" font-size="10" font-weight="600">send_message  ·  stub</text>
  <rect x="556" y="593" width="74" height="16" rx="8" fill="#f5a623" opacity="0.22"/>
  <text x="593" y="605" fill="#f5a623" font-size="9" font-weight="700" text-anchor="middle">APPROVAL</text>


  <!-- ============ MODEL ============ -->
  <g filter="url(#softShadow)">
    <rect x="700" y="498" width="430" height="190" rx="16" fill="url(#runtimeGrad)"/>
  </g>
  <g transform="translate(738, 534)">
    <circle cx="0" cy="0" r="11" fill="none" stroke="#4fc3f7" stroke-width="2"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#4fc3f7" stroke-width="1.6" opacity="0.7"/>
    <path d="M0 -11 c6 5 6 17 0 22 c-6-5-6-17 0-22" fill="none" stroke="#4fc3f7" stroke-width="1.6" opacity="0.7"/>
  </g>
  <text x="762" y="530" fill="#fff" font-size="16" font-weight="700">Model serving</text>
  <text x="762" y="548" fill="#4fc3f7" font-size="10.5" font-weight="500">no OpenAI key — the workspace profile authenticates</text>
  <g filter="url(#subtleShadow)">
    <rect x="720" y="558" width="390" height="26" rx="8" fill="url(#chipGrad)" stroke="#4fc3f7" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="720" y="588" width="390" height="26" rx="8" fill="url(#chipGrad)" stroke="#4fc3f7" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <text x="734" y="575" fill="#4fc3f7" font-size="10" font-weight="600">AI Gateway  ·  host/ai-gateway/mlflow/v1  ·  guardrails apply here</text>
  <text x="734" y="605" fill="#4fc3f7" font-size="10" font-weight="600">system.ai.gpt-5-5  (swap per turn in the model picker)</text>

  <line x1="90" y1="628" x2="650" y2="628" stroke="#fff" stroke-width="1" stroke-opacity="0.15"/>
  <text x="90" y="647" fill="#bb86fc" font-size="10.5" font-weight="600" letter-spacing="0.5">MANAGED MCP  ·  agent.toml  ·  auth = app</text>
  <circle cx="324" cy="643" r="4" fill="#2ecc71"/>
  <text x="336" y="647" fill="#fff" font-size="9.5" opacity="0.5">resolves, discovered per graph build</text>
  <g filter="url(#subtleShadow)">
    <rect x="90" y="654" width="268" height="26" rx="8" fill="url(#chipGrad)" stroke="#bb86fc" stroke-width="1" stroke-opacity="0.5"/>
  </g>
  <circle cx="106" cy="667" r="4" fill="#2ecc71"/>
  <text x="118" y="671" fill="#bb86fc" font-size="10" font-weight="600">web_search</text>
  <text x="378" y="671" fill="#fff" font-size="9.5" opacity="0.4">add more with `agentbricks tools add mcp`</text>

  <!-- State group, balancing the model card -->
  <line x1="720" y1="628" x2="1110" y2="628" stroke="#fff" stroke-width="1" stroke-opacity="0.15"/>
  <text x="720" y="647" fill="#4fc3f7" font-size="10.5" font-weight="600" letter-spacing="0.5">STATE  ·  bound in agent.toml</text>
  <g filter="url(#subtleShadow)">
    <rect x="720" y="654" width="390" height="26" rx="8" fill="url(#chipGrad)" stroke="#4fc3f7" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <text x="734" y="671" fill="#4fc3f7" font-size="10" font-weight="600">session + memory  ·  in-process under dev, durable once deployed</text>

  <!-- Approval gate callout -->
  <path d="M646 667 H685 V690" stroke="#f5a623" stroke-width="2" stroke-dasharray="4,3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <polygon points="679,690 685,700 691,690" fill="#f5a623" opacity="0.7"/>
  <rect x="70" y="700" width="1060" height="30" rx="10" fill="#f5a623" opacity="0.1" stroke="#f5a623" stroke-width="1" stroke-opacity="0.3"/>
  <text x="94" y="720" fill="#f5a623" font-size="10.5" font-weight="600">HUMAN APPROVAL</text>
  <text x="208" y="720" fill="#fff" font-size="10.5" opacity="0.8">the turn pauses on an interrupt event — approve  ·  edit  ·  reject — and resumes as a new invocation with the same session_id. The general-purpose subagent never holds this tool.</text>

  <!-- Return path: events back to the clients -->
  <path d="M1050 376 H1150 V154 H958" stroke="#2ecc71" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <polygon points="962,147 950,154 962,161" fill="#2ecc71" opacity="0.5"/>
  <text x="1140" y="186" fill="#2ecc71" font-size="10.5" font-weight="600" text-anchor="end" opacity="0.85">SSE events</text>
  <text x="1140" y="202" fill="#2ecc71" font-size="9.5" text-anchor="end" opacity="0.6">delta  ·  message  ·  todos  ·  files  ·  interrupt</text>
</svg>
