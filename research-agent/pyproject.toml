[project]
name = "agent-langgraph"
version = "0.1.0"
description = "LangGraph agent on the Agent Bricks durable runtime for Databricks Apps"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Agent Bricks includes the HTTP runtime; this extra adds the langgraph framework adapter.
    "databricks-agentbricks[langgraph]>=0.8.0",
    "databricks-langchain==0.21.0",
    "mcp<2",  # langchain-mcp-adapters 0.3.x uses the MCP 1.x API.
    # Already present transitively (via mcp and langchain-core); declared directly because
    # agent/tools/stats.py imports it to read its figures from a live source.
    "httpx>=0.28,<1",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.124.0",
    "databricks-agents>=1.9.3",
    # The Deep Agents harness: planning, a pluggable filesystem, and subagent delegation on top of
    # langchain's create_agent. Capped below 0.5: SubAgentMiddleware's deprecated kwargs are slated
    # for removal there. Pulls langchain-anthropic (a hard import in deepagents/graph.py) and
    # langchain-google-genai (declared but never imported) transitively — neither needs an API key
    # here, because the only ChatAnthropic() construction is deepagents' get_default_model(), which
    # is reached only when `model is None`, and we always pass a model.
    "deepagents>=0.4.12,<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
